name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: pwsh ./scripts/package-windows.ps1
          - os: macos-latest
            command: ./scripts/package-macos.sh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: lcp-${{ matrix.os }}
          path: dist/*
