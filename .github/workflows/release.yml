name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  package:
    name: Package (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x86_64
            command: pwsh ./scripts/package-windows.ps1
            artifacts: |
              dist/lcp-windows-x86_64.zip
              dist/lcp-windows-x86_64.zip.sha256
          - os: macos-latest
            asset: macos-x86_64
            command: rustup target add x86_64-apple-darwin && LCP_ASSET_ARCH=x86_64 CARGO_BUILD_TARGET=x86_64-apple-darwin ./scripts/package-macos.sh
            artifacts: |
              dist/lcp-macos-*.tar.gz
              dist/lcp-macos-*.tar.gz.sha256
          - os: macos-latest
            asset: macos-arm64
            command: ./scripts/package-macos.sh
            artifacts: |
              dist/lcp-macos-*.tar.gz
              dist/lcp-macos-*.tar.gz.sha256
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: ${{ matrix.artifacts }}

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [package]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
