name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x86_64
            command: pwsh ./scripts/package-windows.ps1
            artifacts: |
              dist/lcp-windows-x86_64.zip
              dist/lcp-windows-x86_64.zip.sha256
          - os: macos-latest
            asset: macos-x86_64
            command: rustup target add x86_64-apple-darwin && LCP_ASSET_ARCH=x86_64 CARGO_BUILD_TARGET=x86_64-apple-darwin ./scripts/package-macos.sh
            artifacts: |
              dist/lcp-macos-*.tar.gz
              dist/lcp-macos-*.tar.gz.sha256
          - os: macos-latest
            asset: macos-arm64
            command: ./scripts/package-macos.sh
            artifacts: |
              dist/lcp-macos-*.tar.gz
              dist/lcp-macos-*.tar.gz.sha256
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: ${{ matrix.artifacts }}

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [package]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            lcp-windows-x86_64.zip
            lcp-windows-x86_64.zip.sha256
            lcp-macos-arm64.tar.gz
            lcp-macos-arm64.tar.gz.sha256
            lcp-macos-x86_64.tar.gz
            lcp-macos-x86_64.tar.gz.sha256
          )
          for file in "${expected[@]}"; do
            test -f "dist/$file"
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes="LCP ${TAG_NAME}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
            gh release edit "$TAG_NAME" --draft=false --latest --title "$TAG_NAME" --notes "$notes"
          else
            gh release create "$TAG_NAME" dist/* --title "$TAG_NAME" --notes "$notes" --latest
          fi
