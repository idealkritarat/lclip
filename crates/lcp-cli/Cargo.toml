[package]
name = "lcp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "lcp"
path = "src/main.rs"

[dependencies]
lcp-protocol = { path = "../lcp-protocol" }
lcp-ipc = { path = "../lcp-ipc" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
arboard = "3"
crossterm = "0.28"
chrono = "0.4"
