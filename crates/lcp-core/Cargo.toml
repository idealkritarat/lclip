[package]
name = "lcp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lcp-protocol = { path = "../lcp-protocol" }
iroh = "1"
iroh-tickets = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
keyring = "4"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
blake3 = "1"
subtle = "2"
getrandom = "0.4"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
